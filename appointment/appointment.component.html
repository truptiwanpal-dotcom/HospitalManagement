 <div class="container mt-4">
    <h2 class="mb-4 text-primary">Book an Appointment</h2>
  
    <form (ngSubmit)="submitForm()" #appointmentForm="ngForm">
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input
          type="text"
          id="fullName"
          class="form-control"          
          required
          [(ngModel)]="appointment.fullName"
          name="fullName"
        />
      </div>
  
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          required
          [(ngModel)]="appointment.email"
          name="email"
        />
      </div>
  
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input
          type="tel"
          id="phone"
          class="form-control"
          required
          [(ngModel)]="appointment.phone"
          name="phone"
        />
      </div>
  
      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input
          type="date"
          id="date"
          class="form-control"
          required
          [(ngModel)]="appointment.date"
          name="date"
        />
      </div>
  
      <div class="mb-3">
        <label for="time" class="form-label">Time</label>
        <input
          type="time"
          id="time"
          class="form-control"
          required
          [(ngModel)]="appointment.time"
          name="time"
        />
      </div>
  
      <div class="mb-3">
        <label for="department" class="form-label">Department</label>
        <select
          id="department"
          class="form-select"
          required
          [(ngModel)]="appointment.department"
          name="department"
        >
          <option value="" disabled selected>Select a department</option>
          <option value="Cardiology">Cardiology</option>
          <option value="Orthopedics">Orthopedics</option>
          <option value="Neurology">Neurology</option>
          <option value="General">General Medicine</option>
        </select>
      </div>
  
      <div class="mb-3">
        <label for="message" class="form-label">Message / Symptoms</label>
        <textarea
          id="message"
          rows="3"
          class="form-control"
          [(ngModel)]="appointment.message"
          name="message"
        ></textarea>
      </div>
  
      <button type="submit" class="btn btn-success">Submit</button>
    </form>
  </div>
